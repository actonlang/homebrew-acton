name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-26, macos-26-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        id: test-bot-formulae
        if: github.event_name == 'pull_request'

      # Each job uploads its own artifact. brew pr-pull downloads all artifacts
      # that match bottles{,_*}.
      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

      # test-bot reports a failed install or test as skipped, and the step
      # passes, when the formula has no bottle for this OS. Fail the job here so
      # the PR does not get the pr-pull label without bottles for this OS.
      - name: Fail if test-bot skipped or failed a formula
        if: github.event_name == 'pull_request' && steps.test-bot-formulae.outputs.skipped_or_failed_formulae != ''
        env:
          FORMULAE: ${{ steps.test-bot-formulae.outputs.skipped_or_failed_formulae }}
        run: |
          echo "test-bot skipped or failed: ${FORMULAE}"
          exit 1
